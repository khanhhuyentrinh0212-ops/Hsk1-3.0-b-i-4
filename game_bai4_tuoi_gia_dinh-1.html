.sent-zh{font-family:'Noto Serif SC',serif;font-size:15px;color:var(--ink);letter-spacing:2px;font-weight:700;margin-bottom:3px;}

.lbhd{background:linear-gradient(135deg,var(--blue),#0A3D7A);border-radius:14px;padding:16px 20px;margin-bottom:14px;display:flex;align-items:center;gap:14px;}

.lbr.g{background:linear-gradient(90deg,#FFF8DC,#FFF3C0);border-color:var(--gold);}
.lbr.s{background:#F5F5F5;border-color:#C0C0C0;}
.lbr.b{background:#FFF0E0;border-color:#CD7F32;}
.mebadge{font-size:9px;background:var(--blue);color:white;padding:1px 5px;border-radius:6px;margin-left:5px;font-weight:700;}
.done-banner{background:linear-gradient(135deg,var(--blue),#0A3D7A);color:white;border-radius:18px;padding:24px;text-align:center;margin-bottom:14px;}
.cbox{background:linear-gradient(135deg,rgba(26,107,158,.08),rgba(124,58,237,.05));border:1.5px solid rgba(26,107,158,.2);border-radius:14px;padding:14px 16px;margin-bottom:10px;}
.ctag{display:inline-block;background:var(--blue);color:white;font-size:10px;font-weight:800;padding:2px 8px;border-radius:8px;margin-bottom:6px;letter-spacing:1px;}
.cformula{font-family:'Noto Serif SC',serif;font-size:15px;color:var(--blue);font-weight:700;margin-bottom:6px;background:white;border-radius:8px;padding:6px 10px;border-left:3px solid var(--blue);}
.cex{font-size:11px;color:var(--muted);line-height:1.7;}
@media(max-width:480px){.og2{grid-template-columns:1fr;}}
</style>

<script>
const VOCAB=[
  {zh:"有",    py:"yǒu",     vi:"Có (sở hữu / tồn tại)",       note:"你有书吗？· 家里有三个人。· Phủ định: 没有(không có)"},
  {zh:"没有",  py:"méiyǒu",  vi:"Không có (phủ định của 有)",   note:"我没有哥哥。· 没有=không có(≠不有❌)"},
  {zh:"多少",  py:"duōshao", vi:"Bao nhiêu (số lớn, không cần lượng từ)",note:"多少钱？· 多少人？· ↔几(mấy, dưới 10, cần lượng từ)"},
  {zh:"几",    py:"jǐ",      vi:"Mấy (số nhỏ dưới 10, cần lượng từ)",  note:"你家有几口人？· 你有几个孩子？· 今年几岁？(hỏi trẻ)"},
  {zh:"个",    py:"gè",      vi:"Cái / Người (lượng từ linh hoạt nhất)", note:"三个人 · 一个姐姐 · 几个朋友"},
  {zh:"口",    py:"kǒu",     vi:"Người (lượng từ đếm thành viên gia đình)",note:"你家有几口人？· 五口之家 · CHỈ dùng cho gia đình!"},
  {zh:"家",    py:"jiā",     vi:"Nhà / Gia đình",               note:"我家=nhà tôi · 在家=ở nhà · 回家=về nhà · 家里=trong nhà"},
  {zh:"和",    py:"hé",      vi:"Và (nối danh từ / đại từ)",    note:"爸爸和妈妈 · 我和你 · ⚠️Không nối động từ hay câu!"},
  {zh:"岁",    py:"suì",     vi:"Tuổi (lượng từ đếm tuổi)",    note:"我今年二十岁。· 几岁？(trẻ) · 多大？(người lớn)"},
  {zh:"今年",  py:"jīnnián", vi:"Năm nay",                     note:"今年多大？· 今年我二十岁。· 今年很忙。"},
  {zh:"去年",  py:"qùnián",  vi:"Năm ngoái",                   note:"去年我十九岁。· ↔今年(năm nay)↔明年(năm tới)"},
  {zh:"明年",  py:"míngnián",vi:"Năm tới / Năm sau",           note:"明年我二十一岁。· 明年回家。· 去年→今年→明年"},
  {zh:"钱",    py:"qián",    vi:"Tiền",                        note:"多少钱？· 一百块钱 · 没有钱=không có tiền"},
  {zh:"十",    py:"shí",     vi:"Mười (số 10)",                note:"十岁=10 tuổi · 十个=10 cái · 二十=20 · 三十=30"},
  {zh:"一百",  py:"yībǎi",   vi:"Một trăm (số 100)",           note:"一百岁=100 tuổi · 一百块钱=100 tệ · 一百个=100 cái"},
  {zh:"苹果",  py:"píngguǒ", vi:"Quả táo / Táo",              note:"苹果多少钱？· 我有一个苹果 · 他喜欢吃苹果"},
  {zh:"朋友",  py:"péngyou", vi:"Bạn bè / Bạn",               note:"好朋友=bạn tốt · 我的朋友 · 你有几个朋友？"},
  {zh:"好朋友",py:"hǎo péngyou",vi:"Bạn thân / Bạn tốt",     note:"她是我好朋友。· 我们是好朋友。"},
  {zh:"都",    py:"dōu",     vi:"Đều / Tất cả (đứng sau CN, trước ĐV)",note:"我们都是学生。· 爸爸和妈妈都很忙。· 都=đều"},
  {zh:"可爱",  py:"kě'ài",   vi:"Dễ thương / Đáng yêu",       note:"太可爱了！· 孩子很可爱。· 你的狗可爱吗？"},
  {zh:"漂亮",  py:"piàoliang",vi:"Đẹp / Xinh đẹp",            note:"太漂亮了！· 她很漂亮。· 你的衣服很漂亮！"},
  {zh:"孩子们",py:"háizimen", vi:"Bọn trẻ / Các em nhỏ",      note:"孩子们都很可爱。· 们=số nhiều(chỉ người)"},
  {zh:"回家",  py:"huí jiā", vi:"Về nhà",                     note:"我想回家！· 明年回家。· 今天几点回家？"},
  {zh:"高",    py:"gāo",     vi:"Cao (chiều cao)",             note:"你多高？· 我一米七。· 他很高。· ↔矮(thấp)"},
  {zh:"久",    py:"jiǔ",     vi:"Lâu / Trong thời gian dài",  note:"多久？=bao lâu？ · 好久不见！=Lâu không gặp! · 你学多久了？"},
];

const CTRUC_QS=[
  {id:"c1",pts:10,
   q:"几岁 vs 多大 — Câu nào ĐÚNG khi hỏi tuổi đứa bé 5 tuổi?",
   opts:["你的女儿今年几岁？(几岁 → hỏi trẻ em, dưới ~10 tuổi)","你的女儿今年多大？(多大 → hỏi người lớn, 18+ tuổi)","你的女儿多少岁？(多少岁 → quá trang trọng, ít dùng)","你的女儿有几岁？(thêm 有 → sai)"],
   correct:0,
   ex:"几岁→trẻ em(1-10 tuổi): 你女儿几岁？→ 她五岁。 | 多大→người lớn(18+): 你今年多大？→ 我二十岁。 | 多少岁→mọi lứa tuổi, lịch sự: 您多少岁了？(hỏi người lớn tuổi). ⚠️ Không dùng 几岁 cho người lớn và không dùng 多大 cho trẻ nhỏ."},
  {id:"c2",pts:10,
   q:"'Bao nhiêu tiền?' và 'Nhà bạn có mấy người?' — Câu ĐÚNG:",
   opts:["多少钱？你家有几口人？","几钱？你家有多少口人？","多少钱？你家有多少口人？","几少钱？你家有几人？"],
   correct:0,
   ex:"多少钱？=Bao nhiêu tiền?(多少 không cần lượng từ) | 你家有几口人？=Nhà bạn có mấy người?(几+口+人, CẦN lượng từ 口). Quy tắc: 几→cần lượng từ sau(几口人·几个孩子) | 多少→không cần lượng từ(多少钱·多少人 đều được)."},
  {id:"c3",pts:10,
   q:"都 đứng ở đâu trong câu? Câu ĐÚNG: 'Bố và mẹ đều là giáo viên.'",
   opts:["爸爸和妈妈都是老师。(都 sau CN, trước ĐV)","都爸爸和妈妈是老师。(都 đứng đầu → SAI)","爸爸和妈妈是都老师。(都 sau ĐV → SAI)","爸爸都和妈妈是老师。(都 giữa và → SAI)"],
   correct:0,
   ex:"都=đều → đứng SAU chủ ngữ, TRƯỚC động từ. 爸爸和妈妈(CN)+都(đều)+是(ĐV)+老师. ⚠️ 都 không đứng đầu câu · 都 không đứng sau động từ. Thêm ví dụ: 我们都是学生 · 孩子们都很可爱 · 朋友们都在家."},
  {id:"c4",pts:10,
   q:"多久 vs 多大 — Câu nào dùng ĐÚNG?",
   opts:["你学汉语多久了？=Bạn học tiếng Trung bao lâu rồi?(多久=bao lâu)","你学汉语多大了？=Bạn học tiếng Trung bao lâu rồi?(SAI)","你多久了？=Bạn bao nhiêu tuổi?(SAI)","你多久学汉语？=Bạn học tiếng Trung bao lâu?(thiếu 了)"],
   correct:0,
   ex:"多久=bao lâu(thời gian): 你学汉语多久了？→ 我学了一年了。 | 多大=bao nhiêu tuổi: 你今年多大？→ 我二十岁。 Phân biệt: 多久(thời gian dài) vs 多大(tuổi). 好久不见=Lâu không gặp!(thành ngữ). 多久了? thường có 了 cuối."},
  {id:"c5",pts:10,
   q:"有 phủ định thế nào? 'Tôi không có bạn thân.' ĐÚNG:",

function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function shuffleIdx(opts,ci){const p=opts.map((o,i)=>({o,ok:i===ci}));const s=shuffle(p);return{opts:s.map(x=>x.o),correct:s.findIndex(x=>x.ok)};}
function shuffleStr(opts,cs){const s=shuffle([...opts]);return{opts:s,correct:s.findIndex(o=>o===cs)};}
function preshuffle(){
  MEAN_QS.forEach(q=>{const r=shuffleStr(q.opts,q.correct);q.opts=r.opts;q._ci=r.correct;});
  CTRUC_QS.forEach(q=>{const r=shuffleIdx(q.opts,q.correct);q.opts=r.opts;q.correct=r.correct;});
  TRANS_QS.forEach(q=>{const r=shuffleIdx(q.opts,q.correct);q.opts=r.opts;q.correct=r.correct;});
}

function buildTabs(){
  document.getElementById("tabs").innerHTML=TABS.map(t=>{
    const tot=t.tF(),done=t.dF();
    return `<div class="tab${atab===t.id?" on":""}" onclick="switchTab('${t.id}')">
      <span style="font-size:${t.id==='ctruc'?'20px':'17px'};font-weight:${t.id==='ctruc'?'900':'400'}">${t.ic}</span>
      <span>${t.lb}</span><span class="tbadge">${tot!==null?done+"/"+tot:"Top"}</span>
    </div>`;}).join("");
}
function switchTab(id){
  atab=id;document.querySelectorAll(".sec").forEach(s=>s.classList.remove("on"));
  document.getElementById("s-"+id).classList.add("on");buildTabs();if(id==="lb")buildLB();
}
function upd(pts,ok){
  if(ok){score+=pts;corr++;streak++;if(streak>maxStrk)maxStrk=streak;}else streak=0;
  document.getElementById("sd").textContent=score;document.getElementById("cd").textContent=corr;
  document.getElementById("stk").textContent=streak;document.getElementById("pd").textContent=Object.keys(ans).length+"/"+TOT;
}
function doAns(qid,chosen,correct,pts,ex,container){
  if(ans[qid]!=null)return;
  const ok=(String(chosen)===String(correct));ans[qid]=ok;upd(pts,ok);buildTabs();
  container.querySelectorAll(".opt").forEach(b=>{
    b.classList.add("locked");const v=b.getAttribute("data-v");
    if(String(v)===String(correct)){b.classList.add("ok");b.innerHTML+=`<span class="badge">✅</span>`;}
    else if(String(v)===String(chosen)){b.classList.add("no");b.innerHTML+=`<span class="badge">❌</span>`;}
    else b.classList.add("dim");b.onclick=null;
  });
  const fb=container.querySelector(".fb"),exb=container.querySelector(".exbox");
  if(fb){fb.textContent=ok?"✅ Đúng! +"+pts+" điểm 🎉":"❌ Xem giải thích 👇";fb.className="fb "+(ok?"ok":"no");}
  if(exb){exb.className="exbox "+(ok?"ok":"no");exb.style.display="block";exb.innerHTML="💡 "+ex;}
}

function buildAll(){buildFlash();buildCtruc();buildMean();buildTrans();}

      <div style="display:flex;flex-direction:column;gap:4px">
        ${keys.map(x=>`<div style="background:var(--paper);border-radius:8px;padding:6px 11px;border-left:3px solid var(--blue);display:flex;align-items:center;gap:8px;flex-wrap:wrap">
          <span style="font-size:14px">${x[3]}</span>
          <div style="font-family:'Noto Serif SC',serif;font-size:14px;color:var(--blue);font-weight:700;min-width:100px">${x[0]}</div>
          <div style="font-size:10px;color:var(--teal);min-width:80px">${x[1]}</div>
          <div style="font-size:11px;color:var(--ink)">${x[2]}</div>

        <div style="background:rgba(200,41,42,.05);border-radius:7px;padding:6px 10px;font-size:11px;font-weight:700;color:var(--red)">
          ⚠️ 几岁(trẻ) vs 多大(người lớn) · 几+lượng từ vs 多少+không cần · 没有≠不有
        </div>
      </div>
    </div>
    <div id="fc" class="fcard" onclick="flipF()"></div>
    <div class="fnav">
      <button class="nbtn" id="pb" onclick="navF(-1)" disabled>← Trước</button>

      <button class="nbtn fill" id="nb" onclick="navF(1)">Tiếp →</button>
    </div><div id="fc-done"></div>`;

}
function rndF(){
  const v=VOCAB[fi];
  document.getElementById("fc").innerHTML=ff?
    `<div style="font-family:'Noto Serif SC',serif;font-size:32px;color:var(--blue);letter-spacing:3px;margin-bottom:6px">${v.zh}</div>
     <div style="font-size:16px;color:var(--teal);font-weight:700;letter-spacing:2px;margin-bottom:6px">${v.py}</div>
     <div style="font-size:16px;font-weight:800;color:var(--ink);margin-bottom:12px">${v.vi}</div>
     <div style="background:var(--paper);border-radius:10px;padding:9px 15px;border-left:4px solid var(--blue);max-width:340px;text-align:left">
       <div style="font-size:10px;color:var(--blue);font-weight:800;letter-spacing:2px;text-transform:uppercase;margin-bottom:2px">Ví dụ</div>
       <div style="font-size:12px;color:var(--muted)">${v.note}</div></div>
     <div style="margin-top:10px;font-size:12px;color:var(--muted)">💡 Bấm lại để lật về</div>`
    :`<div class="fzh">${v.zh}</div><div style="font-size:13px;color:var(--muted);margin-top:4px">👆 Bấm để xem nghĩa & pinyin</div>`;
  document.getElementById("pb").disabled=fi===0;
  const nb=document.getElementById("nb");
  if(fi===VOCAB.length-1){nb.disabled=true;nb.textContent="Hết 🎉";
    document.getElementById("fc-done").innerHTML='<div class="done-banner"><div style="font-size:36px;margin-bottom:5px">👨‍👩‍👧‍👦</div><div style="font-size:17px;font-weight:800">Xem hết 25 từ rồi！</div><div style="font-size:12px;opacity:.85;margin-top:3px">你家有几口人？太可爱了！加油💪</div></div>';}
  else{nb.disabled=false;nb.textContent="Tiếp →";document.getElementById("fc-done").innerHTML="";}
  document.getElementById("dots").innerHTML=VOCAB.map((_,i)=>`<div class="dot" onclick="gotoF(${i})" style="background:${i===fi?"var(--blue)":i<fi?"var(--gold)":"var(--fog)"}"></div>`).join("");
}
function flipF(){ff=!ff;rndF();}
function navF(d){ff=false;fi=Math.max(0,Math.min(VOCAB.length-1,fi+d));rndF();}
function gotoF(i){ff=false;fi=i;rndF();}

const CTRUC_EX={};
function buildCtruc(){
  CTRUC_QS.forEach(q=>{CTRUC_EX[q.id]=q.ex;});
  const boxes=[
    {tag:"几岁 vs 多大",color:"var(--green)",f:"几岁→trẻ em(1-10)\n多大→người lớn(18+)\n多少岁→lịch sự mọi lứa",ex:"她几岁？= Bé ấy mấy tuổi?\n你多大？= Bạn bao nhiêu tuổi?"},
    {tag:"几 vs 多少",color:"var(--blue)",f:"几+lượng từ+N(ước đoán dưới 10)\n多少+N(số lớn, không cần lượng từ)",ex:"你家有几口人？\n苹果多少钱？"},
    {tag:"多+TT = hỏi mức độ",color:"var(--purple)",f:"多高？= cao bao nhiêu?\n多久？= bao lâu?\n多大？= bao nhiêu tuổi?",ex:"你多高？我一米七五。\n你学多久了？我学了一年。"},
    {tag:"都 = đều",color:"var(--orange)",f:"CN + 都 + ĐV (đứng sau CN, trước ĐV)\n❌ 都 không đứng đầu câu",ex:"我们都是学生。\n孩子们都很可爱。"},
    {tag:"没有 = không có",color:"var(--red)",f:"有 → phủ định = 没有\n❌ 不有 hoàn toàn SAI",ex:"我没有哥哥。\n家里没有人。"},
    {tag:"去年·今年·明年",color:"var(--teal)",f:"去年(ngoái)→今年(nay)→明年(tới)\nTuổi tăng dần theo thứ tự này",ex:"去年19岁，今年20，明年21。"},
  ];
  document.getElementById("s-ctruc").innerHTML=`
    <div class="shead">
      <div class="sico" style="background:var(--green);font-family:'Noto Serif SC',serif;font-size:22px;font-weight:900;color:white">几</div>
      <div><div class="stitle">Cấu trúc quan trọng</div><div class="ssub">8 câu · Nhấn chọn ra ngay</div></div></div>`+
  boxes.map(b=>`<div class="cbox">
    <div class="ctag" style="background:${b.color}">${b.tag}</div>
    <div class="cformula">${b.f.split('\n').join('<br>')}</div>
    <div class="cex">${b.ex.split('\n').map(x=>`▸ ${x}`).join('<br>')}</div>
  </div>`).join('')+
  CTRUC_QS.map((q,i)=>{
    const cr=String(q.correct);const id=q.id;
    return `<div class="card" data-q="${id}">
      <div class="ctitle">Câu ${i+1}</div>
      <div class="dbox"><div style="font-size:14px;font-weight:700;line-height:1.6">${q.q}</div></div>
      <div class="og1">${q.opts.map((v,vi)=>`<div class="opt" data-v="${vi}"
        onclick="(function(el){doAns('${id}',el.getAttribute('data-v'),'${cr}',10,CTRUC_EX['${id}'],el.closest('[data-q]'));})(this)">
        <span style="display:block;padding-right:24px">${v}</span>
      </div>`).join("")}</div>
      <div class="fb"></div><div class="exbox"></div>
    </div>`;
  }).join("");
}

function buildMean(){
  document.getElementById("s-mean").innerHTML=`
    <div class="shead"><div class="sico" style="background:var(--green)">🌏</div>
      <div><div class="stitle">Kiểm tra nghĩa</div><div class="ssub">12 câu · Nhấn chọn ra ngay</div></div></div>`+
  MEAN_QS.map((q,i)=>`<div class="card" data-q="${q.id}">
    <div class="ctitle">Câu ${i+1}</div>
    <div class="dbox"><div class="dzh">${q.zh}</div><div class="dpy">${q.py}</div></div>
    <div class="og2">${q.opts.map((v)=>`<div class="opt" data-v="${v.replace(/"/g,'&quot;').replace(/'/g,'&#39;')}"
      onclick="(function(el){doAns('${q.id}',el.getAttribute('data-v'),${JSON.stringify(q.opts[q._ci])},10,${JSON.stringify(q.ex)},el.closest('[data-q]'));})(this)">
      <span style="display:block;padding-right:22px">${v}</span>
    </div>`).join("")}</div>
    <div class="fb"></div><div class="exbox"></div>
  </div>`).join("");
}

// Global map for trans explanations
const TRANS_EX={};
function buildTrans(){
  TRANS_QS.forEach(q=>{TRANS_EX[q.id]=q.ex;});
  document.getElementById("s-trans").innerHTML=`
    <div class="shead"><div class="sico" style="background:var(--teal)">🔄</div>
      <div><div class="stitle">Dịch câu</div>
        <div class="ssub">25 câu · Câu đơn giản · 🇻🇳→🇨🇳 có pinyin</div></div></div>`+
  TRANS_QS.map((q,i)=>{
    const isVi=q.dir==="vi2zh";const id=q.id;
    const cr=String(q.correct);
    const sentHtml=isVi?`<div class="sent-vi">${q.vi}</div>`:`<div class="sent-zh">${q.zh}</div><div class="sent-py">${q.py}</div>`;
    const optsHtml=q.opts.map((o,oi)=>{
      const inner=isVi?`<div class="opt-zh">${o.zh}</div><div class="opt-py">${o.py}</div>`:`<div style="font-size:13px;padding-right:22px">${o.vi}</div>`;
      return `<div class="opt" data-v="${oi}" onclick="(function(el){doAns('${id}',el.getAttribute('data-v'),'${cr}',10,TRANS_EX['${id}'],el.closest('[data-qt]'));})(this)">${inner}</div>`;
    }).join("");
    return `<div class="tcard" data-qt="${id}">
      <div class="ctitle">Câu ${i+1} · ${q.vocab}</div>
      <div class="tdir ${q.dir}">${isVi?"🇻🇳→🇨🇳 Dịch sang tiếng Trung":"🇨🇳→🇻🇳 Dịch sang tiếng Việt"}</div>
      <div class="sent-box">${sentHtml}</div>
      <div class="og1">${optsHtml}</div>
      <div class="fb"></div><div class="exbox"></div>
    </div>`;
  }).join("");
}
